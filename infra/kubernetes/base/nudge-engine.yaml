apiVersion: apps/v1
kind: Deployment
metadata:
  name: nudge-engine
  labels:
    app: nudge-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nudge-engine
  template:
    metadata:
      labels:
        app: nudge-engine
    spec:
      containers:
        - name: nudge-engine
          image: changeforge/nudge-engine:latest
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: changeforge-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nudge-engine
spec:
  selector:
    app: nudge-engine
  ports:
    - port: 8001
      targetPort: 8001
